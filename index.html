<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8">
<title>Pip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <div id="banner" class="banner hidden"></div>
  <main id="screen"></main>
  <button id="simBtn" class="sim-bar" aria-label="Open demo controls"><span>DEMO ONLY</span> Pretend to be the Pip device ▸</button>
  <nav id="tabs" class="tabs">
    <button data-tab="home" class="tab active"><span class="ti">⌂</span>Home</button>
    <button data-tab="schedule" class="tab"><span class="ti">◷</span>Schedule</button>
    <button data-tab="team" class="tab"><span class="ti">☺</span>Team</button>
  </nav>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-card" id="sheetCard"></div></div>
  <div id="alert" class="alert hidden" role="alertdialog" aria-live="assertive"></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
